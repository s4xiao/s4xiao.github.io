# ── Homepage ──────────────────────────────────────────────────────────────
[params.homepage]
eyebrow = "Public Policy & Political Science · Michigan"
# <em> renders in italic gold; <br> controls the line breaks.
headline = "Scientific knowledge,<br>power, and<br><em>authoritarianism</em>."
currentlyLabel = "Currently"
currently = "Joint Ph.D. student,<br>University of Michigan"
bio = """I&rsquo;m a joint Ph.D. student in Public Policy and Political Science. My research employs mixed methods and lies at the intersection of science, technology, and society (STS) and comparative politics. In my dissertation project, I use an interpretive approach to study how science education in non-school settings, such as science museums, is shaped by power dynamics and influences public understanding of science. I&rsquo;m also coauthoring on a survey experiment project on the impacts of AI smart glasses on trust and democratic backsliding."""
interestsLabel = "Research Interests"

