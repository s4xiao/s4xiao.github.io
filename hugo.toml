baseURL = 'https://s4xiao.github.io/'
languageCode = 'en-us'
title = 'Academic Personal Website'
theme = "anatole"

[params]
title = "Siwen Xiao"
description = "PhD Student at University of Michigan, Ann Arbor"
profilePicture = "images/profile.jpg"
customCss = ["css/custom.css"]

# Main page content
[params.homepage]
content = """
Hi everyone! I am a joint Ph.D. student in Public Policy and Political Science. My research interests lie at the intersections of science and technology policy, authoritarian politics, and international political economy. I previously worked as a researcher at the UC Institute on Global Conflict and Cooperation, where she studied China’s science, technology, innovation, and industrial policies. I holds a Master’s in International Affairs from UC San Diego.
"""

