currently = "Joint Ph.D. student,<br>University of Michigan"
bio = """I study how authoritarian states fund and steer science and technology, and how the resulting capacity reshapes economic statecraft. Before Michigan I was a researcher at the <a href="https://ucigcc.org/">UC Institute on Global Conflict and Cooperation</a>, working on China&rsquo;s science, technology, innovation, and industrial policies. I hold a Master&rsquo;s in International Affairs from UC San Diego."""
